name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  # Fast check on every push — ubuntu only
  check:
    name: Typecheck, Lint, Test, Build (ubuntu, Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # Two of the four submodules are PRIVATE (ava-supernova-platform,
          # ava-augmented-value-acceleration). The built-in GITHUB_TOKEN can
          # only see the repo running the workflow, so those two came back
          # 404 and checkout failed before a single check ran — which is why
          # every run here was red while secret-scan, the one workflow that
          # does not fetch submodules, was fine.
          #
          # Fine-grained PAT, Contents:read on the three repos and nothing
          # else. It also covers the main checkout, since this replaces the
          # default token rather than adding to it. NOTE: it expires, and
          # the failure when it does looks exactly like the 404 above.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Dedicated gate for the class of bug that twice shipped to the
      # marketplace in v0.48.x: a scope-level variable referenced inside
      # setupAgent()'s sharedState without being declared in the enclosing
      # function. esbuild transpiles the extension without type-checking,
      # so those references compiled cleanly and only threw at runtime,
      # stranding every user with a disabled chat input.
      #
      # This step runs tsc against the extension and fails the build on
      # TS2304 (cannot find name) or TS18004 (shorthand property not in
      # scope). Runs even if the general typecheck is red for unrelated
      # reasons — pre-existing type errors in the extension shouldn't
      # block the regression gate.
      - name: Undefined-identifier gate (extension)
        if: always()
        run: |
          set +e
          OUTPUT=$(cd packages/extension && pnpm typecheck 2>&1)
          FILTERED=$(echo "$OUTPUT" | grep -E "error TS2304|error TS18004" || true)
          if [ -n "$FILTERED" ]; then
            echo "::error::Undefined identifier(s) detected in the extension — would throw at runtime."
            echo "$FILTERED"
            exit 1
          fi
          echo "✓ No undefined-identifier errors in the extension."

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Cross-platform check — only on PRs to main
  check-cross-platform:
    name: Build (${{ matrix.os }})
    if: github.base_ref == 'main'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # Two of the four submodules are PRIVATE (ava-supernova-platform,
          # ava-augmented-value-acceleration). The built-in GITHUB_TOKEN can
          # only see the repo running the workflow, so those two came back
          # 404 and checkout failed before a single check ran — which is why
          # every run here was red while secret-scan, the one workflow that
          # does not fetch submodules, was fine.
          #
          # Fine-grained PAT, Contents:read on the three repos and nothing
          # else. It also covers the main checkout, since this replaces the
          # default token rather than adding to it. NOTE: it expires, and
          # the failure when it does looks exactly like the 404 above.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # Two of the four submodules are PRIVATE (ava-supernova-platform,
          # ava-augmented-value-acceleration). The built-in GITHUB_TOKEN can
          # only see the repo running the workflow, so those two came back
          # 404 and checkout failed before a single check ran — which is why
          # every run here was red while secret-scan, the one workflow that
          # does not fetch submodules, was fine.
          #
          # Fine-grained PAT, Contents:read on the three repos and nothing
          # else. It also covers the main checkout, since this replaces the
          # default token rather than adding to it. NOTE: it expires, and
          # the failure when it does looks exactly like the 404 above.
          token: ${{ secrets.SUBMODULE_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency vulnerability audit
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Secret detection — free CLI mode, no license needed
      - name: Secret detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
